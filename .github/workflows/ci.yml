name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cargopulse
          POSTGRES_USER: cargopulse
          POSTGRES_PASSWORD: cargopulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cargopulse" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cargopulse:cargopulse@localhost:5432/cargopulse
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hmac-sha256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --create-db --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
